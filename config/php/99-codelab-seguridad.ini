; ============================================================
;  Endurecimiento de PHP para el contenedor web de Moodle.
;  Se monta en /usr/local/etc/php/conf.d/ (docker-compose.yml y,
;  con el mismo contenido, infra/moodle/templates/app.sh.tftpl).
;
;  El progreso de subida de sesión es el camino confirmado de
;  CVE-2026-115560, sin versión corregida a 29-oct-2026, y uno de
;  los de PHP2Shell (CVE-2026-109619). Moodle no lo usa, así que
;  apagarlo no rompe nada. Tiene que ir aquí, antes de que PHP
;  parsee la petición: ini_set() o un .user.ini llegan tarde.
;
;  Esto NO sustituye al parche: lo que corrige PHP2Shell es usar
;  PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 o posterior.
; ============================================================
session.upload_progress.enabled = 0
expose_php = Off
