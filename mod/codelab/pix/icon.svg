<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CodeLab">
  <!-- Fondo azul oscuro redondeado -->
  <rect width="100" height="100" rx="16" ry="16" fill="#1E3A5F"/>

  <!-- Flecha izquierda < -->
  <polyline points="28,38 14,50 28,62"
            fill="none" stroke="#89B4FA" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flecha derecha > -->
  <polyline points="72,38 86,50 72,62"
            fill="none" stroke="#89B4FA" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Barra diagonal / -->
  <line x1="58" y1="30" x2="42" y2="70"
        stroke="#A6E3A1" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Punto verde "play" (esquina superior derecha) -->
  <circle cx="76" cy="24" r="10" fill="#A6E3A1"/>
  <polygon points="73,19 73,29 82,24" fill="#1E3A5F"/>
</svg>
